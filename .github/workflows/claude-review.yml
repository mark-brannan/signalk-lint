name: Claude PR Review

# An independent reviewer for every PR: a fresh Claude with no shared
# context with whichever session wrote the code.
#
# A run costs real tokens, so it only happens when the PR's content has
# changed. `synchronize` also fires on every rebase -- and Mergify now keeps
# open pull requests up to date with main, so that is no longer rare. The gate
# below hashes the raw tree diff (paths, modes, blob ids) between the merge
# base and HEAD -- not `git patch-id`, which ignores whitespace inside changed
# lines -- and remembers each fingerprint in the Actions cache; a matching
# fingerprint skips the review. It is recorded only once a comment from the
# bot is actually on the PR, because the action exits green even when it
# posted nothing. An evicted entry costs one extra review, never a missed one.
# Ported from mark-brannan/symphony 66bdddc.
#
# Advisory only: no ruleset requires this check.
#
# Auth: needs the CLAUDE_CODE_OAUTH_TOKEN secret (mint one with
# `claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).
# Swap to `anthropic_api_key` for metered API billing instead.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Queue rather than cancel: a cancelled review has already spent its tokens
# and never records its fingerprint, so the replacement run would spend them
# again. The common trigger is a Mergify update, which queues behind the
# running review and then skips on the fingerprint.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Skip drafts, and skip fork PRs -- forks can't read the secret, so a
    # run there only produces a red X that means nothing.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22 is the floor declared in engines; review against the floor.
          node-version: 22
          cache: npm

      - name: Fingerprint the PR's content
        id: fp
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch -q origin "$BASE"
          raw=$(git diff-tree -r --no-commit-id "$(git merge-base "origin/$BASE" HEAD)" HEAD)
          if [ -n "$raw" ]; then id=$(printf '%s\n' "$raw" | sha256sum | cut -d' ' -f1); else id=empty; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Skip if this content was already reviewed
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .claude-reviewed
          key: claude-review-pr${{ github.event.pull_request.number }}-${{ steps.fp.outputs.id }}
          lookup-only: true

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the independent reviewer for this repository. The PR was
            most likely written by another Claude session; your job is to
            challenge it, not to extend it courtesy. You share no context
            with the author -- everything you assert must come from the
            repo, the diff, or something you ran yourself.

            Read the README first: this is a lint tool for Signal K server
            installations, and a rule that silently stops firing is its
            worst failure mode. CI already proves the CLI still flags
            test/fixtures/vulnerable-server.json and stays quiet on
            test/fixtures/current-server.json -- reviewers reproduce that,
            not assume it. Run `npm ci`, `npm run format:check`,
            `npm run build`, `npm test`, and the same CLI smoke check CI
            runs, and compare against what the PR description claims. If a
            claim doesn't match what you observe, say so bluntly.

            Be extra suspicious of: a deleted, loosened, or skipped test; a
            rule whose matching logic got narrower without a fixture
            proving it still fires; advisory data edited by hand rather
            than via scripts/update-advisories.mjs; and any change the
            description doesn't motivate. One logical change per PR. Ask
            the question that forces a justification, not just a fix.

            Post findings as inline comments via
            mcp__github_inline_comment__create_inline_comment (with
            `confirmed: true`) anchored to the lines they concern, and one
            top-level summary via `gh pr comment`. In the summary, list
            what you checked and what you ran, even when everything passed.
            Do not push commits or edit code; you review, the author fixes.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff origin/main...HEAD),Bash(git log origin/main..HEAD),Bash(git status),Bash(npm ci),Bash(npm run build),Bash(npm test),Bash(npm run format:check),Bash(node dist/cli.js:*)"

      - if: steps.seen.outputs.cache-hit != 'true'
        name: Confirm a review comment actually landed
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.fp.outputs.since }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | length")
          echo "posted=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] || echo "::warning::no review comment posted; fingerprint not recorded"

      - if: steps.seen.outputs.cache-hit != 'true' && steps.posted.outputs.posted == 'true'
        name: Remember that this content was reviewed
        run: echo "${{ steps.fp.outputs.id }}" > .claude-reviewed

      - if: steps.seen.outputs.cache-hit != 'true' && steps.posted.outputs.posted == 'true'
        uses: actions/cache/save@v4
        with:
          path: .claude-reviewed
          key: claude-review-pr${{ github.event.pull_request.number }}-${{ steps.fp.outputs.id }}
