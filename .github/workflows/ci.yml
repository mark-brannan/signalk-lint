name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Restricting this to `main` meant a
  # PR stacked on another PR's branch got no CI at all -- no build, no tests, no
  # smoke check -- and the gap is invisible: the checks aren't red, they simply
  # aren't there. A change is worth testing on its own merits, not on the merits
  # of the branch it happens to be aimed at.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines; 24 catches breakage early.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test

      # Rules are only useful if they still fire. This runs the real CLI
      # against a fixture with known vulnerabilities and fails if it reports
      # nothing -- catching the case where the rule silently stops matching,
      # which unit tests on their own would not notice if the CLI wiring broke.
      - name: Smoke test the CLI end to end
        run: |
          node dist/cli.js --snapshot test/fixtures/current-server.json
          if node dist/cli.js --snapshot test/fixtures/vulnerable-server.json; then
            echo "Expected a non-zero exit for a vulnerable snapshot"
            exit 1
          fi
          # A config directory that isn't there must fail, not report nothing
          # and exit 0. Checked here as well as in the unit test because it is
          # the CLI's exit code that people and scripts actually rely on.
          #
          # Pinned to exactly 2, not merely non-zero: 1 means "there is a
          # verdict and it is bad", 2 means "there is no verdict". A missing
          # config directory landing on 1 would report findings nobody made.
          node dist/cli.js --config-dir /nonexistent/path/xyz && status=0 || status=$?
          if [ "$status" -ne 2 ]; then
            echo "Expected exit 2 for a missing config directory, got $status"
            exit 1
          fi

          # A capture from an older release must still lint. This regressed
          # once already: pluginConfig arriving as undefined rather than null
          # crashed a rule that guards correctly against null, and --snapshot
          # is the mode the whole architecture exists for.
          node -e "
            const fs = require('node:fs')
            const s = JSON.parse(fs.readFileSync('test/fixtures/current-server.json', 'utf8'))
            delete s.server.pluginConfig
            delete s.server.system.hasRTC
            fs.writeFileSync('/tmp/legacy-snapshot.json', JSON.stringify(s))
          "
          node dist/cli.js --snapshot /tmp/legacy-snapshot.json

  # The single required status check, shared across repositories: the
  # `gate` job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed or was skipped, so it reports an explicit
  # pass or fail of its own rather than inheriting the skip.
  ci-gate:
    needs: [build]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
